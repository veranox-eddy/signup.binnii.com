# signup.binnii.com — public, anonymous-facing registration site.
# Laravel standard; PHP-FPM 8.3.
server {
    listen 443 ssl;
    server_name signup.binnii.com;

    root /var/www/html/signup.binnii.com/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
